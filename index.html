<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iNEX">
<meta name="theme-color" content="#1f7a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="inex-180.png">
<title>iNEX</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--fg:#17211d;--mut:#6b7872;--line:#e3e8e5;--pri:#1f7a5c;--priT:#fff;--inc:#1f9d6b;--exp:#d6453d;--shadow:0 2px 10px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1512;--card:#18211d;--fg:#e8efec;--mut:#8fa098;--line:#26322d;--pri:#35b58a;--priT:#06150f;--inc:#3ccb92;--exp:#ff6b60;--shadow:none}}
:root[data-theme=dark]{--bg:#0f1512;--card:#18211d;--fg:#e8efec;--mut:#8fa098;--line:#26322d;--pri:#35b58a;--priT:#06150f;--inc:#3ccb92;--exp:#ff6b60;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;padding-top:env(safe-area-inset-top);-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:12px 16px 150px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input[type=color]{padding:2px;height:44px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 0}
label>input,label>select{margin-top:4px;font-size:16px;color:var(--fg)}
h1{font-size:22px;margin:0}
h3{margin:0 0 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin:8px 0}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--pri);color:var(--priT);font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.nav button{width:44px;height:40px;font-size:26px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.nav .lbl{font-weight:600}
.custom{display:flex;gap:10px;margin-bottom:8px}.custom label{flex:1;margin:0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.card{background:var(--card);border-radius:14px;padding:10px 10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card small{display:block;color:var(--mut);font-size:12px}
.card b{font-size:15px;word-break:break-word}
.card.i b{color:var(--inc)}.card.e b{color:var(--exp)}
.srch{display:flex;gap:8px;margin-bottom:6px}
.srch input{flex:1}
.ico{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);flex:none}
.dh{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;padding:12px 4px 4px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.row .ic,.chip .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.row .mid{flex:1;min-width:0}.row .mid b{display:block;font-weight:600}
.row small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}.amt.income{color:var(--inc)}.amt.expense{color:var(--exp)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
#tabs button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button span{font-size:22px;line-height:1}
#tabs button.on{color:var(--pri);font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--pri);color:var(--priT);font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.big{font-size:32px;font-weight:700;text-align:center;margin:10px 0}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:2px solid transparent;background:var(--card);font-size:11px;text-align:center;min-width:0}
.chip.on{border-color:var(--pri)}
.chip .ic{width:36px;height:36px}
.chip>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:13px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.btns .primary{background:var(--pri);color:var(--priT);border-color:var(--pri)}
.btns .danger{color:var(--exp)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.sec h3{font-size:15px;margin-bottom:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--mut)}
.x{color:var(--exp);padding:4px 10px;font-size:18px}
.lnk{color:var(--pri);font-weight:600;padding:8px 0;display:block;text-align:left;width:100%}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none}
.pie{width:220px;height:220px;display:block;margin:6px auto}
.leg .li b{font-weight:600}
.pct{color:var(--mut);font-size:13px;min-width:44px;text-align:right}
.hint{color:var(--mut);font-size:13px;margin:8px 0 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
.cih{background:var(--pri);color:var(--priT);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.cih small{display:block;opacity:.85;font-size:13px}
.cih b{font-size:26px;word-break:break-word}
.accs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.subacc{border-top:1px solid var(--line);padding:4px 0 6px}
.subacc:first-of-type{border-top:0}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
.acc small{display:block;color:var(--mut);font-size:12px}
.acc b{font-size:14px;word-break:break-word}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chips.sub{margin-top:6px}
.mb{position:relative;display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;border-radius:50%;color:#fff;font-size:.85em;font-weight:700;vertical-align:-.2em;overflow:hidden}
.mb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.accrows{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.accrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;color:var(--fg);text-align:left}
.accrow .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.accrow .n{flex:1;font-weight:600}.accrow small{color:var(--mut)}.accrow .chev{color:var(--mut);font-size:22px}
.accgrp{border-top:1px solid var(--line);padding:8px 0}
.accgrp:first-of-type{border-top:0}
.accgrp h4{margin:0 0 6px;font-size:14px}
.accgrp select{width:100%}
label.dpick{position:relative;display:inline-block;margin:0;padding:9px 16px;font-size:16px;font-weight:600;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px}
label.dpick>input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;border:0;font-size:16px}
.fbtns{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(6px + env(safe-area-inset-bottom));margin-top:10px;z-index:2}
.shead{display:flex;justify-content:flex-end;margin:-4px 0 4px}
.sx{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px;color:var(--fg)}
.bkp{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--pri);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.bkp span{flex:1}
.bkp button{background:var(--pri);color:var(--priT);border-radius:10px;padding:8px 12px;font-weight:600;white-space:nowrap}
.amt.tr{color:var(--mut)}
.cards.two{grid-template-columns:repeat(2,1fr)}
.chips.two{grid-template-columns:repeat(2,1fr)}
.chips.two .chip{flex-direction:row;justify-content:flex-start;gap:8px;padding:8px 10px;font-size:13px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 6px;margin-bottom:12px}
.dayh{font-weight:700;margin-bottom:6px;text-align:center}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcol{min-width:0}
.dct{color:var(--pri);font-weight:700;text-align:center;font-size:14px;margin-bottom:2px}
.cr{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
.cr .cn{flex:1;min-width:0}
.cr .cname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca{white-space:nowrap;font-variant-numeric:tabular-nums}
.dctot{text-align:right;font-weight:700;padding:5px 0 2px;font-size:14px;font-variant-numeric:tabular-nums}
.dcol.i .dctot{color:var(--inc)}.dcol.e .dctot{color:var(--exp)}
.dbal{text-align:right;font-weight:600;border-top:1px solid var(--line);margin-top:8px;padding:8px 2px 6px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0 12px;font-size:14px}
.tot{font-size:13.5px}
.tot .r2{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.tot .r2 span{white-space:nowrap}
.tot .r1{text-align:right;margin-top:4px}
.tot .inc{color:var(--inc)}.tot .exp{color:var(--exp)}
.ytab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ytab th{color:var(--pri);font-weight:600;font-size:13px;text-align:right;padding:6px 4px}
.ytab th:first-child,.ytab td:first-child{text-align:left}
.ytab td{padding:10px 4px;border-top:1px solid var(--line);text-align:right;font-size:14px}
.ytab tr.m{cursor:pointer}
.ytab td.z{color:var(--mut)}
.ytab tr.t td{font-weight:700;color:var(--pri);font-size:13px;border-top:2px solid var(--line)}
.ipick{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:4px}
.ipcur{font-size:30px;text-align:center;padding:2px 0 6px}
.igrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:176px;overflow:auto;-webkit-overflow-scrolling:touch}
.ig{font-size:22px;line-height:1;padding:7px 0;border-radius:10px;border:2px solid transparent;background:transparent}
.ig.on{border-color:var(--pri);background:var(--bg)}
.amtrow{display:flex;gap:8px;align-items:center}
.amtrow .big{flex:1;min-width:0}
.calcbtn{width:52px;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:24px;flex:none}
.calcbtn.on{border-color:var(--pri);background:var(--bg)}
.calc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:6px}
.cdisp{text-align:right;padding:4px 8px 8px;min-height:58px;overflow:hidden}
#calc_disp{font-size:26px;font-weight:600;word-break:break-all}
#calc_res{color:var(--mut);font-size:14px;min-height:18px}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ckeys button{padding:13px 0;border-radius:12px;background:var(--bg);font-size:20px;border:1px solid var(--line)}
.ckeys .op{color:var(--pri);font-weight:700}
.ckeys .use{grid-column:span 2;background:var(--pri);color:var(--priT);border-color:var(--pri);font-weight:700;font-size:17px}
.cardrow{padding:10px 0;border-top:1px solid var(--line)}
.cardrow:first-of-type{border-top:0}
.cardrow .kv{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.bar.hi>i{background:var(--exp)}
.dsec{margin-top:8px}
.dst{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--mut);padding:6px 2px 2px}
.dst.i b{color:var(--inc)}.dst.e b{color:var(--exp)}
.day .row{border:0;border-top:1px solid var(--line);border-radius:0;background:none;margin:0;padding:10px 2px}
.day .dst+.row{border-top:0}
.row .av{background:var(--pri);color:var(--priT);font-weight:700;border-radius:50%}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;background:#fff;font-size:12px;padding:0}
  #print h2{margin:0 0 4px}#print table{width:100%;border-collapse:collapse;margin:10px 0}
  #print td,#print th{border-bottom:1px solid #ccc;padding:4px 6px;text-align:left}
  #print td.r,#print th.r{text-align:right}
  body{background:#fff}
}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f4f6f5;transition:opacity .45s ease,visibility .45s}
@media(prefers-color-scheme:dark){#splash{background:#0f1512}}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:150px;height:auto;border-radius:34px;box-shadow:0 14px 34px rgba(16,90,62,.35);opacity:0;transform:scale(.55) rotate(-8deg);animation:spop .8s cubic-bezier(.2,1.4,.4,1) .1s forwards}
#splash .tg{margin-top:26px;color:#6b7872;opacity:0;font-size:17px;font-weight:600;letter-spacing:.5px;animation:sfade .6s ease 1s forwards}
#splash .tg b{color:#1f9d6b}#splash .tg i{color:#d6453d;font-style:normal}
@keyframes spop{to{opacity:1;transform:none}}
@keyframes sfade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pad = n => String(n).padStart(2, '0');

// basic calculator: + - × ÷ with the usual order of operations; returns NaN for an incomplete or invalid sum
function calcEval(s) {
  const tk = String(s).match(/\d+(?:\.\d*)?|\.\d+|[+\-*/]/g) || [];
  if (tk[0] === '-') tk.unshift('0');
  while (tk.length && /^[+\-*/]$/.test(tk[tk.length - 1])) tk.pop();
  if (!tk.length) return NaN;
  const out = [tk[0]];
  for (let i = 1; i < tk.length; i += 2) {
    const op = tk[i], r = parseFloat(tk[i + 1]);
    if (op === '*' || op === '/') { const l = parseFloat(out.pop()); out.push(String(op === '*' ? l * r : (r === 0 ? NaN : l / r))); }
    else out.push(op, tk[i + 1]);
  }
  let acc = parseFloat(out[0]);
  for (let i = 1; i < out.length; i += 2) acc = out[i] === '+' ? acc + parseFloat(out[i + 1]) : acc - parseFloat(out[i + 1]);
  return isFinite(acc) ? Math.round(acc * 100) / 100 : NaN;
}

// Bring any stored profile up to the current shape: account kinds, opening balance, card limit, one cash account.
function migrate(s) {
  Object.keys(s.data).forEach(pid => {
    const d = s.data[pid];
    d.accounts = d.accounts || [];
    d.tx = d.tx || [];
    if (!d.v2) { // first time on the multi-account version: add the starter accounts, drop unused old extras
      STD.forEach(id => { if (!d.accounts.find(a => a.id === id)) d.accounts.push({id, name:STD_NAME[id], open:0}); });
      d.accounts = d.accounts.filter(a => STD.includes(a.id) || d.tx.some(x => x.acc === a.id || x.from === a.id || x.to === a.id));
      d.v2 = true;
    }
    d.accounts.forEach(a => {
      if (typeof a.open !== 'number') a.open = 0;
      if (typeof a.limit !== 'number') a.limit = 0;
      a.kind = kindOfAcc(a);
      if (a.kind === 'savings' && !a.stype) a.stype = 'dps';
    });
    if (!d.accounts.some(a => a.kind === 'cash')) d.accounts.push({id:'cash', name:'Cash', kind:'cash', open:0, limit:0});
    sortAccounts(d);
  });
  s.settings = s.settings || {theme:'auto', lang:'en', cur:'৳'};
  if (!s.settings.firstUse) s.settings.firstUse = Date.now();
  if (s.settings.backupDays === undefined) s.settings.backupDays = 7;
  return s;
}
function load() {

}

}

// personal loans: effect on the chosen account, and on what the person owes me (+ = they owe me)
const LOAN_ACC = {lend:-1, borrow:1, receive:1, repay:-1};
const LOAN_LED = {lend:1, borrow:-1, receive:-1, repay:1};
const pkey = n => String(n || '').trim().toLowerCase();
function loanPeople() {
  const m = {};
  P().tx.forEach(x => {
    if (x.type !== 'loan') return;
    const k = pkey(x.person), o = m[k] || (m[k] = {key:k, name:String(x.person || '').trim(), bal:0, last:'', items:[]});
    o.bal += LOAN_LED[x.ltype] * x.amount; o.items.push(x);
    if (x.date >= o.last) o.last = x.date;   // the name keeps the spelling it was first entered with
  });
  const list = Object.values(m);
  list.forEach(o => o.bal = Math.round(o.bal * 100) / 100);
  return list.sort((a, b) => ((b.bal !== 0) - (a.bal !== 0)) || Math.abs(b.bal) - Math.abs(a.bal) || b.last.localeCompare(a.last));
}
function loanTotals(ps) {
  ps = ps || loanPeople();
  return {recv:ps.filter(p => p.bal > 0).reduce((s, p) => s + p.bal, 0), pay:ps.filter(p => p.bal < 0).reduce((s, p) => s - p.bal, 0)};

function balances() {
  const b = {};
  P().accounts.forEach(a => b[a.id] = a.open || 0);
  P().tx.forEach(x => {
    if (x.type === 'income') b[x.acc] = (b[x.acc] || 0) + x.amount;
    else if (x.type === 'expense') b[x.acc] = (b[x.acc] || 0) - x.amount;
    else if (x.type === 'transfer') { b[x.from] = (b[x.from] || 0) - x.amount; b[x.to] = (b[x.to] || 0) + x.amount; }
    else if (x.type === 'loan') b[x.acc] = (b[x.acc] || 0) + LOAN_ACC[x.ltype] * x.amount;
  });
  return b;
}

function range() {

  if (U.mode === 'month') return [ymd(new Date(r.getFullYear(), r.getMonth(), 1)), ymd(new Date(r.getFullYear(), r.getMonth() + 1, 0))];
  if (U.mode === 'year') return [r.getFullYear() + '-01-01', r.getFullYear() + '-12-31'];
  return U.from <= U.to ? [U.from, U.to] : [U.to, U.from];
}

  else if (U.mode === 'month') { r.setDate(1); r.setMonth(r.getMonth() + n); }

}

function pie(items, total) {
  if (!items.length) return '';
  const R = 90, cx = 100, cy = 100; let a0 = -Math.PI / 2, paths = '';
  if (items.length === 1) paths = `<circle cx="100" cy="100" r="${R}" fill="${items[0].color}"/>`;
  else items.forEach(it => {
    const a1 = a0 + it.v / total * 2 * Math.PI;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${it.color}"/>`;
    a0 = a1;
  });
  return `<svg viewBox="0 0 200 200" class="pie">${paths}<circle cx="100" cy="100" r="50" fill="var(--bg)"/></svg>`;
}

function parseCSV(text) {

  if (id === 'na_prov') { const n = $('#na_name'); if (n) n.value = e.target.value === 'Other' ? '' : e.target.value; return; }
  if (ds.open || ds.owed || ds.limit || ds.aname) {
    const a = P().accounts.find(k => k.id === (ds.open || ds.owed || ds.limit || ds.aname));
    const v = toNum(e.target.value), n = isNaN(v) ? 0 : Math.round(v * 100) / 100;
    if (a) {
      if (ds.open) a.open = n;
      else if (ds.owed) a.open = -n;               // money owed on a card is stored as a negative balance
      else if (ds.limit) a.limit = Math.max(0, n);
      else if (String(e.target.value).trim()) a.name = String(e.target.value).trim();
      save(); toast(t('saved'));
    }
  }
  else if (id === 'cf') { U.from = e.target.value || U.from; render(); }
  else if (id === 'ct') { U.to = e.target.value || U.to; render(); }
  else if (id === 'cur') { S.settings.cur = e.target.value || '৳'; save(); toast(t('saved')); }
  else if (id === 'fRestore' && e.target.files[0]) {
    const f = e.target.files[0]; e.target.value = '';
    f.text().then(txt => {
      try { const s = JSON.parse(txt); if (!s.profiles || !s.data || !s.cur) throw 0; if (!confirm(t('restoreConfirm'))) return; S = migrate(s); save(); render(); toast(t('saved')); }
      catch (err) { toast(t('badFile')); }
    });
  }
  else if (id === 'fCsv' && e.target.files[0]) {
    const f = e.target.files[0]; e.target.value = '';
    f.text().then(txt => {
      const list = rowsToTx(parseCSV(txt) || []);
      if (!list || !list.length) { toast(t('badFile')); return; }
      const s = sums(list);
      if (confirm(list.length + ' ' + t('importAsk') + '\n' + t('income') + ': ' + money(s.i) + '\n' + t('expense') + ': ' + money(s.e))) { commitImport(list); toast(list.length + ' ' + t('imported')); }
    });
  }
});

/* ---------- keep the screen current ---------- */
let todayStr = ymd(new Date());
// after midnight (or a long time in the background) move a view that was showing "today" to the new today
function dayRollover() {
  const n = ymd(new Date());
  if (n === todayStr) return;
  if (ymd(U.ref) === todayStr) U.ref = new Date();
  todayStr = n; render();
}
// ask the server which version is published; if it differs from this one, offer a one-tap update
function checkUpdate() {
  if (!/^https?:$/.test(location.protocol) || !window.fetch) return;
  const u = 'index.html?_=' + Date.now();
  fetch(u, {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(txt => {
    const m = txt.match(/const VERSION = '([^']+)'/);
    if (m && m[1] !== VERSION) { U.update = m[1]; render(); }
  }).catch(() => {}).then(() => { try { caches.open('dte-v1').then(c => c.delete(u)); } catch (e) {} });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { dayRollover(); checkUpdate(); } });

/* ---------- start ---------- */
render();
checkUpdate();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

// opening animation: show the name for a moment, then fade away (tap to skip)
(function () { try {
  const sp = document.querySelector('#splash'); if (!sp) return;
  const hide = () => { sp.classList.add('out'); setTimeout(() => { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 600); };
  sp.addEventListener('click', hide); setTimeout(hide, 2300);
} catch (e) {} })();
</script>
